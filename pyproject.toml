[project]
name = "tyrannus-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.1",
    "openai>=1.0",
    "pydantic>=2.0",
    "playwright>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
tyrannus-social = "servers.social_media.server:main"
tyrannus-marketing = "servers.marketing.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "servers"]
